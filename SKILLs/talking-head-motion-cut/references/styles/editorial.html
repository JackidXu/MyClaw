<!doctype html>
<html lang="zh-CN">
<!--
  Style: editorial — 米色 · 珊瑚红块 · 大号斜体引言 · 杂志感
  ──────────────────────────────────────────────
  强调色: #ff3a2d (珊瑚红) / #1f6bff (蓝环) / #f2cf3a (黄点)
  建议字体: 衬线 ui-serif,"Songti SC",serif
  最佳搭配: layout=overlay/pip/stack · frame=clean/polaroid
  内容: 产品发布 / 编辑专栏 / 大字宣言

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。斜体大标题是标志性元素。

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#ff3a2d; --c-primary-soft:#ff8a82; --c-primary-deep:#c41f14;
      --c-accent:#1f6bff; --c-text:#0e1018; --c-text-dim:#6b6353;
      --c-bg-deep:#f1e8d5; --c-bg-card:rgba(241,232,213,0.95);
    }
-->
<head><meta charset="utf-8"><title>style · editorial</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-editorial">
<style>
  .card[data-card-id="ref-editorial"] .root{
    --bg:#f1e8d5; --ink:#0e1018; --muted:#6b6353; --accent:#ff3a2d; --accent2:#1f6bff; --accent3:#f2cf3a;
    --font-head:ui-serif,"Songti SC","Times New Roman",serif;
    --font-body:ui-serif,"Songti SC",serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
    width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);
    padding:96px 104px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:40px;
    color:var(--ink);font-family:var(--font-body);
  }
  .card[data-card-id="ref-editorial"] .kicker{align-self:flex-start;padding:12px 24px;background:var(--ink);color:var(--bg);font:700 24px/1 var(--font-mono);letter-spacing:.22em}
  .card[data-card-id="ref-editorial"] .title{margin:0;font:italic 800 196px/0.95 var(--font-head);color:var(--ink);letter-spacing:-.01em;max-width:92%}
  .card[data-card-id="ref-editorial"] .first{font-style:italic;color:var(--accent)}
  .card[data-card-id="ref-editorial"] .quote-mark{font:800 320px/.5 var(--font-head);color:var(--accent);position:absolute;top:40px;right:104px;opacity:.9}
  .card[data-card-id="ref-editorial"] .detail{margin:0;font:44px/1.5 var(--font-body);color:var(--muted);max-width:78%}
  .card[data-card-id="ref-editorial"] .hl{background:linear-gradient(transparent 62%,rgba(255,58,45,.22) 62%);color:var(--ink);padding:0 6px}
  .card[data-card-id="ref-editorial"] .block-coral{position:absolute;top:110px;right:150px;width:150px;height:150px;background:var(--accent);transform:rotate(12deg)}
  .card[data-card-id="ref-editorial"] .dot-yellow{position:absolute;top:340px;right:104px;width:56px;height:56px;background:var(--accent3);border-radius:50%}
  .card[data-card-id="ref-editorial"] .ring-blue{position:absolute;bottom:140px;right:140px;width:120px;height:120px;border:4px solid var(--accent2);border-radius:50%}
</style>
<div class="root">
  <span class="accents block-coral"></span>
  <span class="accents dot-yellow"></span>
  <span class="accents ring-blue"></span>
  <span class="kicker">TAKEAWAY</span>
  <h1 class="title"><span class="first">真</span>正的创造，从拒绝套路开始。</h1>
  <p class="detail">停止模仿、停止套模板，把每一个想法都当作<span class="hl">第一次表达</span>。只有这样，作品才会带上你的体温。</p>
</div>
</div></div></div></body></html>
