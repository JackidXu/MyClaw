<!doctype html>
<html lang="zh-CN">
<!--
  Style: minimal — 纯黑字白底 · 巨大字号 · 大量留白
  ──────────────────────────────────────────────
  强调色: 无彩色，靠字重与字号制造层次（accent 即为黑）
  建议字体: Inter / ui-sans-serif
  最佳搭配: layout=split/stack/overlay · frame=clean/hairline
  内容: 极简陈述 / 数据揭示 / 大字标题

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。极致留白，适合一句话金句。

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#000000; --c-primary-soft:#333333; --c-primary-deep:#000000;
      --c-accent:#000000; --c-text:#000000; --c-text-dim:#6b7280;
      --c-bg-deep:#ffffff; --c-bg-card:rgba(255,255,255,0.96);
    }
-->
<head><meta charset="utf-8"><title>style · minimal</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-minimal">
<style>
  .card[data-card-id="ref-minimal"] .root{
    --bg:#ffffff; --ink:#000000; --muted:#6b7280;
    --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
    width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);
    padding:120px 140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:80px;font-family:var(--font-sans);
  }
  .card[data-card-id="ref-minimal"] .kicker{font:600 22px/1 var(--font-sans);letter-spacing:.32em;color:var(--ink);text-transform:uppercase}
  .card[data-card-id="ref-minimal"] .title{margin:0;font:900 200px/.95 var(--font-sans);color:var(--ink);letter-spacing:-.04em}
  .card[data-card-id="ref-minimal"] .detail{margin:0;font:400 54px/1.4 var(--font-sans);color:var(--muted);max-width:82%;letter-spacing:-.005em}
  .card[data-card-id="ref-minimal"] .rule{width:360px;height:6px;background:var(--ink)}
</style>
<div class="root">
  <span class="kicker">TAKEAWAY</span>
  <h1 class="title">五秒<br/>决定一切</h1>
  <div class="rule"></div>
  <p class="detail">用户给一个新界面的时间不超过五秒。第一屏不需要解释，需要让人立刻知道这是什么、为什么有用。</p>
</div>
</div></div></div></body></html>
