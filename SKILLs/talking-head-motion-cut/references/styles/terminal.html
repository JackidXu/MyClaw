<!doctype html>
<html lang="zh-CN">
<!--
  Style: terminal — 深终端底 · 等宽字体 · ASCII 边框 · 多色高亮 · 闪烁光标
  ──────────────────────────────────────────────
  强调色: #4ade80 (绿, 输出) / #fbbf24 (琥珀, 字符串) / #f472b6 (品红, 变量) / #60a5fa (蓝, 函数)
  建议字体: ui-monospace,"SF Mono",Menlo,monospace（无需自带字体）
  最佳搭配: layout=split/pip · frame=hairline/clean
  内容: 技术分析 / 代码片段 / 性能数据 / 工程思考

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。光标闪烁用纯 CSS @keyframes（允许，单指示符无害）。

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#4ade80; --c-primary-soft:#9bf0b8; --c-primary-deep:#22a85a;
      --c-accent:#fbbf24; --c-text:#e6edf3; --c-text-dim:#7d8590;
      --c-bg-deep:#0d1117; --c-bg-card:rgba(13,17,23,0.94);
    }
-->
<head><meta charset="utf-8"><title>style · terminal</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-terminal">
<style>
  .card[data-card-id="ref-terminal"] .root{
    --bg:#0d1117; --ink:#e6edf3; --muted:#7d8590; --green:#4ade80; --amber:#fbbf24; --magenta:#f472b6; --blue:#60a5fa;
    --font-mono:ui-monospace,"SF Mono",Menlo,"Courier New",monospace;
    width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);
    padding:60px 84px;box-sizing:border-box;font:44px/1.55 var(--font-mono);
  }
  .card[data-card-id="ref-terminal"] .ascii-frame{position:absolute;inset:28px;border:2px solid #2c333e;border-radius:6px;box-shadow:inset 0 0 0 1px #1a1f27,0 0 0 1px #06080c}
  .card[data-card-id="ref-terminal"] .titlebar{position:absolute;left:64px;top:20px;padding:0 12px;background:var(--bg);font:600 22px/1 var(--font-mono);color:var(--muted);letter-spacing:.12em}
  .card[data-card-id="ref-terminal"] .content{position:relative;padding:30px 20px;display:flex;flex-direction:column;gap:22px}
  .card[data-card-id="ref-terminal"] .prompt{color:var(--green)}
  .card[data-card-id="ref-terminal"] .line .blue{color:var(--blue)}
  .card[data-card-id="ref-terminal"] .line .amber{color:var(--amber)}
  .card[data-card-id="ref-terminal"] .line .pink{color:var(--magenta)}
  .card[data-card-id="ref-terminal"] .line .green{color:var(--green)}
  .card[data-card-id="ref-terminal"] .line .muted{color:var(--muted)}
  .card[data-card-id="ref-terminal"] .kicker{color:var(--muted);font:600 26px/1 var(--font-mono);letter-spacing:.22em;margin-bottom:6px}
  .card[data-card-id="ref-terminal"] .headline{font:700 88px/1.15 var(--font-mono);color:var(--ink);margin:6px 0 22px}
  .card[data-card-id="ref-terminal"] .headline .hl{background:rgba(74,222,128,.18);color:var(--green);padding:0 10px}
  .card[data-card-id="ref-terminal"] .cursor{display:inline-block;width:22px;height:44px;background:var(--green);margin-left:6px;vertical-align:-6px;animation:ref-term-blink 1s steps(1) infinite}
  @keyframes ref-term-blink{50%{opacity:0}}
</style>
<div class="root">
  <div class="ascii-frame"></div>
  <span class="titlebar">~/notes/takeaway-007.md</span>
  <div class="content">
    <div class="kicker">$ cat takeaway</div>
    <h2 class="headline">缓存命中率提升到 <span class="hl">92%</span></h2>
    <div class="line"><span class="prompt">$</span> bench --tier <span class="amber">"hot"</span> <span class="muted">--n 10k</span></div>
    <div class="line"><span class="muted">→</span> <span class="blue">p50</span>=<span class="green">12ms</span> <span class="blue">p99</span>=<span class="green">38ms</span> <span class="pink">hit</span>=<span class="green">92.4%</span></div>
    <div class="line"><span class="muted">// before this change: hit=63%, p99=210ms</span></div>
    <div class="line"><span class="prompt">$</span><span class="cursor"></span></div>
  </div>
</div>
</div></div></div></body></html>
