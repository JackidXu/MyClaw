<!doctype html>
<html lang="zh-CN">
<!--
  Style: xhs — 小红书 · 奶油底+热粉 · chips · #话题 · ❤️💬 互动行
  ──────────────────────────────────────────────
  强调色: #ff2e63 (热粉, chip+互动图标) / #ff8a4c (橙, 标签) / #f0c419 (黄, 图钉)
  建议字体: ui-sans-serif,system-ui,"PingFang SC",sans-serif
  最佳搭配: layout=overlay/stack（尤其竖屏 9:16）· frame=clean/polaroid
  内容: 社交剪辑 / 生活方式 / 种草 / 短视频高光

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。user-row + tags + ❤️💬 互动行是本风格标志。
    这就是你记得的「表情/气泡/点赞」富元素出处——互动行（user-row 之上的 ❤️💬⭐ 区块）就定义在本风格里，可连同 .user-row / .tags 一起整段复制去其它风格复用，无需独立点缀库。

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#ff2e63; --c-primary-soft:#ff8aae; --c-primary-deep:#c41e4c;
      --c-accent:#ff8a4c; --c-text:#1d1418; --c-text-dim:#8a7a78;
      --c-bg-deep:#fff5e9; --c-bg-card:rgba(255,245,233,0.96);
    }
-->
<head><meta charset="utf-8"><title>style · xhs (小红书)</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-xhs">
<style>
  .card[data-card-id="ref-xhs"] .root{
    --bg:#fff5e9; --ink:#1d1418; --muted:#8a7a78; --accent:#ff2e63; --accent2:#ff8a4c; --accent3:#f0c419;
    --font-sans:ui-sans-serif,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;
    width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    padding:64px 80px;box-sizing:border-box;display:flex;flex-direction:column;gap:40px;
  }
  .card[data-card-id="ref-xhs"] .user-row{display:flex;align-items:center;gap:24px}
  .card[data-card-id="ref-xhs"] .avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#ff2e63,#ff8a4c);box-shadow:0 0 0 4px #fff,0 0 0 6px rgba(255,46,99,.3)}
  .card[data-card-id="ref-xhs"] .user-info{flex:1}
  .card[data-card-id="ref-xhs"] .user-name{font:700 38px/1.1 var(--font-sans);color:var(--ink)}
  .card[data-card-id="ref-xhs"] .user-sub{font:400 28px/1.3 var(--font-sans);color:var(--muted)}
  .card[data-card-id="ref-xhs"] .follow{padding:14px 34px;border-radius:999px;background:var(--accent);color:#fff;font:700 28px/1 var(--font-sans)}
  .card[data-card-id="ref-xhs"] .title{margin:0;font:800 140px/1.1 var(--font-sans);color:var(--ink);letter-spacing:-.01em}
  .card[data-card-id="ref-xhs"] .title .heart{color:var(--accent)}
  .card[data-card-id="ref-xhs"] .detail{margin:0;font:500 46px/1.5 var(--font-sans);color:var(--ink);max-width:94%}
  .card[data-card-id="ref-xhs"] .tags{display:flex;flex-wrap:wrap;gap:18px}
  .card[data-card-id="ref-xhs"] .tag{padding:14px 30px;border-radius:999px;background:rgba(255,46,99,.12);color:var(--accent);font:600 30px/1 var(--font-sans)}
  .card[data-card-id="ref-xhs"] .tag.orange{background:rgba(255,138,76,.16);color:var(--accent2)}
  .card[data-card-id="ref-xhs"] .tag.yellow{background:rgba(240,196,25,.18);color:#a98209}
  .card[data-card-id="ref-xhs"] .interactions{display:flex;gap:44px;margin-top:auto;padding-top:22px;border-top:1px solid rgba(0,0,0,.06);font:700 36px/1 var(--font-sans);color:var(--ink)}
  .card[data-card-id="ref-xhs"] .interactions span{display:inline-flex;align-items:center;gap:14px}
  .card[data-card-id="ref-xhs"] .interactions .heart-ic{color:var(--accent);font-size:42px}
</style>
<div class="root">
  <div class="user-row">
    <div class="avatar"></div>
    <div class="user-info">
      <div class="user-name">@小研究员</div>
      <div class="user-sub">关注我，看我每天拆一段视频 · 18分钟前</div>
    </div>
    <div class="follow">+ 关注</div>
  </div>
  <h2 class="title">亲测有效！<span class="heart">♥</span> 30 秒抓住注意力的小技巧</h2>
  <p class="detail">开头别废话——直接抛结论。听众的大脑在前 3 秒就决定要不要继续，这是平台算法之外，最朴素也最重要的事实。</p>
  <div class="tags">
    <span class="tag">#内容创作</span>
    <span class="tag orange">#播客剪辑</span>
    <span class="tag yellow">#开头技巧</span>
  </div>
  <div class="interactions">
    <span><span class="heart-ic">♥</span> 12.4k</span>
    <span>💬 386</span>
    <span>⭐ 891</span>
    <span style="margin-left:auto;color:var(--muted);font-weight:400;font-size:28px">📤 分享</span>
  </div>
</div>
</div></div></div></body></html>
