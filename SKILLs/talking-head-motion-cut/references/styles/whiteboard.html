<!doctype html>
<html lang="zh-CN">
<!--
  Style: whiteboard — 暖纸 · Caveat 手写体 · 草绘边框 · 马克笔高亮
  ──────────────────────────────────────────────
  强调色: #ff6b35 (橙马克笔) / #2557a7 (蓝笔批注) / #ffe066 (黄荧光)
  建议字体: Caveat（手写）/ 回退 "LXGW WenKai TC",ui-serif,cursive
  最佳搭配: layout=pip/overlay/split · frame=polaroid/clean
  内容: 教程 / 解构 / 草图思考 / 灵感整理

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。手写体+草绘边框+黄色马克笔是高识别度元素。
    （手写体依赖 Caveat 字体；技能已自带此字体，渲染时确保在 public/fonts/ 内。）

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#ff6b35; --c-primary-soft:#ffa37e; --c-primary-deep:#d44a1c;
      --c-accent:#2557a7; --c-text:#1a1a1a; --c-text-dim:#6e6a5b;
      --c-bg-deep:#fdf6e3; --c-bg-card:rgba(253,246,227,0.96);
    }
-->
<head><meta charset="utf-8"><title>style · whiteboard</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-whiteboard">
<style>
  .card[data-card-id="ref-whiteboard"] .root{
    --bg:#fdf6e3; --ink:#1a1a1a; --muted:#6e6a5b; --accent:#ff6b35; --accent2:#2557a7; --accent3:#ffe066;
    --font-hand:"Caveat","LXGW WenKai TC",ui-serif,cursive;
    width:100%;height:100%;position:relative;overflow:hidden;background-color:var(--bg);
    background-image:
      radial-gradient(circle at 30% 20%,rgba(0,0,0,.025) 0%,transparent 50%),
      radial-gradient(circle at 80% 70%,rgba(0,0,0,.02) 0%,transparent 50%);
    padding:88px 104px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:40px;
    color:var(--ink);font-family:var(--font-hand);
  }
  .card[data-card-id="ref-whiteboard"] .sketch-border{position:absolute;inset:28px;pointer-events:none}
  .card[data-card-id="ref-whiteboard"] .sketch-border path{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .card[data-card-id="ref-whiteboard"] .kicker{align-self:flex-start;font:700 52px/1 var(--font-hand);color:var(--accent);transform:rotate(-2deg);padding-left:12px}
  .card[data-card-id="ref-whiteboard"] .title{margin:0;font:700 190px/1 var(--font-hand);color:var(--ink)}
  .card[data-card-id="ref-whiteboard"] .marker{position:relative;display:inline-block;padding:0 12px;color:var(--ink)}
  .card[data-card-id="ref-whiteboard"] .marker::before{content:"";position:absolute;left:0;right:0;top:30%;bottom:18%;background:var(--accent3);z-index:-1;transform:skewX(-4deg)}
  .card[data-card-id="ref-whiteboard"] .detail{margin:0;font:400 64px/1.4 var(--font-hand);color:var(--muted);max-width:92%}
  .card[data-card-id="ref-whiteboard"] .note{align-self:flex-start;padding:10px 20px;font:600 46px/1 var(--font-hand);color:var(--accent2);border-bottom:4px wavy var(--accent2);transform:rotate(-1deg)}
</style>
<div class="root">
  <svg class="sketch-border" viewBox="0 0 1024 1800" preserveAspectRatio="none"><path d="M 12 12 L 1012 16 L 1008 1788 L 16 1784 Z"/></svg>
  <span class="kicker">✎ TAKEAWAY</span>
  <h2 class="title">把复杂问题<span class="marker">画出来</span>。</h2>
  <p class="detail">文字让人争辩，图让人对齐。当所有人都在白板前看同一张图，分歧自然消失。</p>
  <span class="note">← 试试每次会议都画</span>
</div>
</div></div></div></body></html>
