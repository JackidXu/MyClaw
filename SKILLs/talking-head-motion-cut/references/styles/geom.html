<!doctype html>
<html lang="zh-CN">
<!--
  Style: geom — 深黑底 · 黄绿+荧光粉撞色 · 粗黑体 slab 几何块
  ──────────────────────────────────────────────
  强调色: #d4ff00 (黄绿, 主块) / #ff2e88 (荧光粉, 次块) / #ffffff (线)
  建议字体: Inter / ui-sans-serif 极粗
  最佳搭配: layout=pip/overlay/stack · frame=clean/hairline
  内容: 产品发布 / 大胆宣言 / 撞色封面 / 短视频高光

  ★ 应用方式同 academic（A 换肤 / B 签名卡）。撞色 slab 块是标志性元素，注意内容放中间留白区。

  :root 重映射（快速换肤用）:
    :root{
      --c-primary:#d4ff00; --c-primary-soft:#eaff7a; --c-primary-deep:#a3c400;
      --c-accent:#ff2e88; --c-text:#ffffff; --c-text-dim:#aaaaaa;
      --c-bg-deep:#0a0a0a; --c-bg-card:rgba(10,10,10,0.92);
    }
-->
<head><meta charset="utf-8"><title>style · geom</title>
<style>html,body{margin:0;padding:0;background:#0a0c12;font-family:ui-sans-serif,system-ui,sans-serif}
.stage{position:relative;width:1080px;height:1920px;transform-origin:top left;transform:scale(.42);overflow:hidden}
.card-host{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body><div class="stage"><div class="card-host"><div class="card" data-card-id="ref-geom">
<style>
  .card[data-card-id="ref-geom"] .root{
    --bg:#0a0a0a; --ink:#ffffff; --muted:#aaaaaa; --accent:#d4ff00; --accent2:#ff2e88; --accent3:#ffffff;
    --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
    width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
  }
  .card[data-card-id="ref-geom"] .slab-1{position:absolute;left:0;top:0;width:760px;height:300px;background:var(--accent)}
  .card[data-card-id="ref-geom"] .slab-2{position:absolute;right:0;bottom:0;width:500px;height:500px;background:var(--accent2)}
  .card[data-card-id="ref-geom"] .stripe{position:absolute;left:-60px;top:1080px;height:6px;width:840px;background:var(--accent3);transform:rotate(-6deg)}
  .card[data-card-id="ref-geom"] .content{position:absolute;left:90px;top:360px;right:680px;bottom:120px;display:flex;flex-direction:column;justify-content:center;gap:40px}
  .card[data-card-id="ref-geom"] .kicker{align-self:flex-start;padding:12px 22px;background:var(--ink);color:var(--bg);font:800 26px/1 var(--font-mono);letter-spacing:.24em}
  .card[data-card-id="ref-geom"] .title{margin:0;font:900 230px/.92 var(--font-sans);color:var(--ink);letter-spacing:-.04em;text-transform:uppercase}
  .card[data-card-id="ref-geom"] .stroke{-webkit-text-stroke:4px var(--accent);color:transparent}
  .card[data-card-id="ref-geom"] .detail{margin:0;font:600 40px/1.4 var(--font-sans);color:var(--muted);max-width:88%}
  .card[data-card-id="ref-geom"] .detail .pink{color:var(--accent2)}
</style>
<div class="root">
  <span class="slab-1"></span>
  <span class="slab-2"></span>
  <span class="stripe"></span>
  <div class="content">
    <span class="kicker">TAKEAWAY</span>
    <h1 class="title"><span class="stroke">BIG</span><br/>IDEA.</h1>
    <p class="detail">别再做温和的中间方案。要么<span class="pink">最大胆</span>，要么不做。</p>
  </div>
</div>
</div></div></div></body></html>
