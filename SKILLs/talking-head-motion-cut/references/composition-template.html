<!doctype html>
<html lang="zh-CN">
<!--
  ════════════════════════════════════════════════════════════════════════════
  composition-template.html — 口播动效剪辑 HTML composition 框架模板（v2 框架）
  ════════════════════════════════════════════════════════════════════════════
  本模板是「超会AI 动效剪辑」成片效果的参数化框架。框架结构（不能随意改）与
  动效质量（对齐成片）已锁定；但具体文案 / 时间码 / 步骤数 / 配色 全部由你按
  口播内容重新填入，模板里不写死任何业务参数。

  ── 本框架的段落模型（STEP MODEL，核心铁律）──────────────────────────────
  [ 固定开头 ] → 步骤①动效面板 → 步骤②素材展示面板 → 步骤③动效面板
               → 步骤④背景留白 → [ 固定结尾 ]
  • 固定区（绝不能省）：开头标题卡(0–4.5s) + 结尾全屏总结卡，两段都保留。
  • 动效面板 vs 背景留白：每个步骤二选一。目标：背景留白 ≈ 总时长 20%。
      背景留白 = 不挂任何面板、背景保持清晰（纯真人 + 字幕），制造呼吸感。
  • 至少保留 1 个「素材展示面板」（类型 B）：嵌入一段素材视频，作为模板演示区。
  • 节奏对齐（最重要）：面板 start = 该段口播起点，面板 end = 该段口播终点；
      面板内部元素逐句跟口播弹出（时间点落在讲到对应信息的时刻）。
      错把面板提前收掉 = 文案还在讲、画面已空，是头号观感 bug。
  • 风格配色按文案判断：见 references/design-guide.md「内容类型→风格」表，
      全片选 1 个风格 + 1 边框，把其 :root 重映射块注入本文件顶部 :root。

  ── 使用方式 ─────────────────────────────────────────────────────────────
  1. 复制本文件到工作目录 public/index.html
  2. 原片放 public/input-video.mp4（音频保留；render.js 直接映射原音轨，不截断）
  3. 顶部 :root 注入所选风格的配色（不选则用默认示例琥珀主题）
  4. 改 HTML 占位文案 + 把步骤时间码 config 块换成 transcript 真实值
  5. 渲染：node <技能根目录>/render.js public -o output.mp4 --fps 30

  ── 骨架规定（验证过不出错的前提）────────────────────────────────────────
  • 嵌套：#stage > .video-wrapper(#bg-video) + .dim-veil + .card-host > .card > .root
  • 背景虚化托管：blurOn(s)/blurOff(s) 控制 #bg-video 的 blur+brightness 与压暗层
  • 面板显隐：data-start/data-duration + tl.set(H,visibility)；动效进出只 tween opacity
  • track-index：字幕=10（最顶），标题=2，动效卡=5，总结卡=4，HUD=9
  • 素材视频：<video class="material-clip" data-scene-start="段落起点秒">，放 public/vid/
  • 主题色 CSS 变量层：换配色只改 :root 注入块，全局生效
  ════════════════════════════════════════════════════════════════════════════
-->
<head>
  <meta charset="utf-8" />
  <style>
    /* ── 主题色变量层 ──
       ★ 视觉身份注入点：从 references/styles/<name>.html 顶部「:root 重映射」块
       拷到下面 :root 里，覆盖默认示例主题，全片配色即统一（每片只选 1 个风格）。
       配色按文案调性判断，见 references/design-guide.md「内容类型→风格」表。 */
    :root {
      --c-primary: #ffd400;        /* 主色：步骤标签/重点字/CTA/印章 */
      --c-primary-soft: #ffe066;   /* 主色浅版：字幕关键词、次级高亮 */
      --c-primary-deep: #f5a623;   /* 主色深版：渐变末端 */
      --c-accent: #ffd400;         /* 强调色：数字、金色高亮 */
      --c-text: #ffffff;           /* 默认浅文字 */
      --c-text-dim: #aeb6c2;       /* 次级浅文字 */
      --c-bg-deep: #05070c;        /* 深底 */
      --c-bg-card: rgba(10,14,20,0.9);
      --sans: "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
      --mono: "SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
      font-family: var(--sans); }
    #stage { position:relative; width:100%; height:100%; overflow:hidden; }

    /* 视频满屏（画中画时由 GSAP 缩成角落小窗） */
    .video-wrapper { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
    .video-wrapper video { width:100%; height:100%; object-fit:cover; }
    .video-wrapper.pip-pill { border-radius:14px;
      box-shadow:0 24px 60px -20px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.7),0 0 0 5px rgba(0,0,0,.18);
      overflow:hidden; }

    /* 压暗蒙版：动效/素材模式下叠在虚化原片之上，制造压暗感（由 bgState.d 控制） */
    .dim-veil { position:absolute; left:0; top:0; width:1080px; height:1920px; background:#000; opacity:0; pointer-events:none; z-index:2; }

    .card-host { position:absolute; pointer-events:none; overflow:hidden; }
    .card-host .card { position:relative; width:100%; height:100%; overflow:hidden; }
    .card-host[data-track-index="10"] { z-index:10; }   /* 字幕永远最顶，防全屏卡遮挡 */

    /* ── 字幕 rail：无底框白字 + 暗描边，关键词主色高亮 ── */
    .rail-root { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:0 70px; }
    .rail-pill { display:inline-block; padding:0; border-radius:0; background:transparent; backdrop-filter:none;
      color:#fff; font:700 58px/1.5 var(--sans); text-align:center; max-width:94%;
      text-shadow:0 3px 14px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95); }
    .hl-key { color:var(--c-primary); font-weight:700; }
    .hl-num { color:var(--c-primary); font-weight:700; }

    /* ── 标题卡：封面式标题，纯文字 + 顶部渐变遮罩，无卡片容器/无错峰动效 ── */
    .card[data-card-id="title"] .root { width:100%; height:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      background: linear-gradient(180deg, rgba(5,7,12,0.92) 0%, rgba(5,7,12,0.35) 55%, transparent 100%); }
    .card[data-card-id="title"] .ttl { font:800 84px/1.2 var(--sans); color:#fff; text-align:center; max-width:900px;
      text-shadow:0 4px 22px rgba(0,0,0,0.7); }
    .card[data-card-id="title"] .sub { font:600 32px/1 var(--mono); color:var(--c-primary); letter-spacing:1px; }

    /* ════════ 面板通用：景深4层（底板 + 光晕 + 界面卡 + 前景印章） ════════ */
    .motion-panel, .mat-panel { z-index:5; }
    .motion-panel .root, .mat-panel .root {
      position:relative; z-index:1; width:100%; height:100%;
      display:flex; flex-direction:column; justify-content:center; gap:18px; padding:46px 48px;
      border-radius:30px; background:rgba(8,12,18,0.78); border:1px solid rgba(255,255,255,0.15);
      box-shadow:0 40px 110px -30px rgba(0,0,0,0.9), 0 0 80px rgba(255,212,0,0.16), inset 0 1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,212,0,0.10); }
    .mp-glow { position:absolute; left:50%; top:46%; width:1120px; height:1120px; transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(255,212,0,0.22) 0%, rgba(255,212,0,0.07) 40%, transparent 68%);
      pointer-events:none; z-index:0; }
    .mp-badge { position:absolute; right:28px; top:28px; z-index:3; font:900 24px/1 var(--mono); letter-spacing:2px;
      color:#0a0d12; background:var(--c-primary); padding:10px 16px; border-radius:12px; transform:rotate(-6deg);
      box-shadow:0 8px 24px rgba(255,212,0,0.35); }
    .mp-kick { font:700 23px/1 var(--mono); color:var(--c-primary); letter-spacing:3px; }
    .mp-title { font:800 50px/1.1 var(--sans); color:#fff; }
    .mp-uline { height:5px; width:120px; margin-top:6px; border-radius:3px;
      background:linear-gradient(90deg,var(--c-primary),transparent); transform-origin:left; transform:scaleX(0); }
    .mp-cap { font:600 21px/1 var(--mono); color:var(--c-text-dim); letter-spacing:1px; }

    /* ── 面板类型 A：具象 UI mockup（建智能体界面 + 进度计数）── */
    .ui-screen { position:relative; width:100%; border-radius:22px; padding:24px 26px; overflow:hidden;
      background:linear-gradient(160deg, rgba(22,28,40,0.96), rgba(12,16,24,0.96));
      border:1px solid rgba(255,255,255,0.12); box-shadow:inset 0 1px 0 rgba(255,255,255,0.06); }
    .ui-screen::before { content:''; position:absolute; inset:0; opacity:.05;
      background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px); background-size:28px 28px; }
    .ui-bar { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
    .ui-bar .d { width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,0.25); }
    .ui-bar .d.g { background:#3ad07a; }
    .ui-bar .t { margin-left:10px; font:600 22px/1 var(--sans); color:var(--c-text-dim); }
    .ui-head { display:flex; align-items:center; gap:16px; margin-top:18px; position:relative; z-index:1; }
    .ui-ava { width:64px; height:64px; border-radius:18px; flex:none; position:relative;
      background:linear-gradient(135deg,var(--c-primary),var(--c-primary-deep));
      display:flex; align-items:center; justify-content:center; font:800 30px/1 var(--sans); color:#0a0d12;
      box-shadow:0 0 18px rgba(255,212,0,.4); }
    .ui-ava .on { position:absolute; right:-2px; bottom:-2px; width:16px; height:16px; border-radius:50%;
      background:#3ad07a; border:2px solid #0a0d12; }
    .ui-name { font:800 34px/1.1 var(--sans); color:#fff; }
    .ui-sub { font:500 20px/1.2 var(--sans); color:var(--c-text-dim); margin-top:4px; }
    .ui-roles { display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
    .ui-chip { font:600 22px/1 var(--sans); color:var(--c-text-dim); padding:10px 16px; border-radius:14px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); }
    .ui-chip.on { color:#0a0d12; background:var(--c-primary); border-color:var(--c-primary); box-shadow:0 0 18px rgba(255,212,0,.4); }
    .ui-list { margin-top:18px; display:flex; flex-direction:column; gap:12px; position:relative; z-index:1; }
    .ui-item { display:flex; align-items:center; gap:14px; font:600 25px/1.2 var(--sans); color:#e7ecf3; }
    .ui-check { width:34px; height:34px; border-radius:10px; flex:none; background:var(--c-primary);
      display:flex; align-items:center; justify-content:center; color:#0a0d12; font:800 22px/1 var(--sans);
      box-shadow:0 0 14px rgba(255,212,0,.4); }
    .ui-prog { margin-top:18px; position:relative; z-index:1; }
    .ui-prog .l { font:600 20px/1 var(--mono); color:var(--c-text-dim); letter-spacing:1px; }
    .ui-track { margin-top:10px; height:10px; border-radius:6px; background:rgba(255,255,255,0.12); overflow:hidden; }
    .ui-fill { height:100%; width:100%; transform-origin:left; border-radius:6px;
      background:linear-gradient(90deg,var(--c-primary),var(--c-primary-deep)); }

    /* ── 面板类型 B：素材展示（嵌入素材视频 + 扫描线 + 角标）── 模板素材区 ── */
    .mat-panel .root { padding:0; background:#000; border:1px solid rgba(255,255,255,0.18);
      box-shadow:0 40px 110px -30px rgba(0,0,0,0.9); }
    .mat-panel video { width:100%; height:100%; object-fit:cover; display:block; }
    .mat-scan { position:absolute; left:0; top:0; width:100%; height:3px; z-index:4;
      background:linear-gradient(90deg,transparent,rgba(255,212,0,0.95),transparent);
      box-shadow:0 0 18px rgba(255,212,0,.7); opacity:0; }
    .mat-chip { position:absolute; display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px;
      background:rgba(5,7,12,0.66); color:#fff; font:600 22px/1 var(--mono); letter-spacing:1px;
      backdrop-filter: blur(4px); z-index:5; }
    .mat-chip.tl { left:18px; top:18px; color:var(--c-primary); }
    .mat-chip.tr { right:18px; top:18px; }
    .mat-chip.bl { left:18px; bottom:18px; }
    .mat-chip.br { right:18px; bottom:18px; }
    .mat-rec { width:11px; height:11px; border-radius:50%; background:#ff5b5b; box-shadow:0 0 8px #ff5b5b; }

    /* ── 面板类型 C：聊天气泡 ── */
    .chat { display:flex; flex-direction:column; gap:18px; width:100%; margin-top:6px; }
    .bubble { max-width:84%; padding:20px 24px; border-radius:20px; font:600 30px/1.42 var(--sans); position:relative; }
    .bubble.user { align-self:flex-end; background:var(--c-primary); color:#0a0d12; border-bottom-right-radius:6px; }
    .bubble.ai { align-self:flex-start; background:rgba(255,255,255,0.1); color:#fff;
      border:1px solid rgba(255,255,255,0.16); border-bottom-left-radius:6px; }
    .typed { display:inline-block; }

    /* ── 面板类型 D（可选）：记忆/累积（中枢节点 + 卡片）── 视内容启用 ──
       若某步内容讲「随时间沉淀/经验累积」，可用此类型替掉某个动效面板。
       结构参考：.mem > .mem-cards(.mem-card×N) + .mem-brain(.mem-ring×3 + .mem-core)。
       动画写法同 m1/m3（错峰弹出 + 中枢节点 back.out 汇聚），此处不强制启用。 */
    .mem { display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; margin-top:6px; }
    .mem-cards { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .mem-card { padding:16px 20px; border-radius:16px; background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12); font:700 26px/1.2 var(--sans); color:#fff; }
    .mem-brain { position:relative; width:160px; height:160px; margin-top:4px; }
    .mem-ring { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,212,0,0.4); }
    .mem-ring.r2 { inset:20px; border-color:rgba(255,212,0,0.25); }
    .mem-ring.r3 { inset:40px; border-color:rgba(255,212,0,0.14); }
    .mem-core { position:absolute; inset:56px; border-radius:50%;
      background:radial-gradient(circle, #ffe066, #f5a623); box-shadow:0 0 40px rgba(255,212,0,.6); }

    /* ── 全屏总结卡 ── */
    .card[data-card-id="finale"] .root { width:100%; height:100%; display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:42px; padding:0 90px;
      background:linear-gradient(160deg, var(--c-bg-deep) 0%, #000 100%); color:var(--c-text); }
    .f-h { font:800 110px/1.15 var(--sans); color:#fff; text-align:center; text-shadow:0 6px 30px rgba(0,0,0,0.6); }
    .f-cta { font:700 42px/1.35 var(--sans); color:var(--c-primary); text-align:center; letter-spacing:1px;
      text-shadow:0 4px 20px rgba(0,0,0,0.5); }
    .f-tag { font:600 26px/1 var(--mono); color:var(--c-text-dim); letter-spacing:2px; }

    /* ── 取景器 HUD（常驻覆盖层）── */
    .hud { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; }
    .bracket { position:absolute; width:54px; height:54px; border:3px solid rgba(255,255,255,0.7); }
    .bracket.tl { left:28px; top:28px; border-right:none; border-bottom:none; }
    .bracket.tr { right:28px; top:28px; border-left:none; border-bottom:none; }
    .bracket.bl { left:28px; bottom:28px; border-right:none; border-top:none; }
    .bracket.br { right:28px; bottom:28px; border-left:none; border-top:none; }
    .hud-tl { position:absolute; left:42px; top:34px; font:600 26px/1.3 var(--sans); color:#fff;
      letter-spacing:.5px; text-shadow:0 2px 6px rgba(0,0,0,0.85); }
    .hud-tl b { color:var(--c-primary); font-weight:700; }
    .hud-tr { position:absolute; right:42px; top:36px; font:600 24px/1 var(--mono); color:#fff;
      text-shadow:0 2px 6px rgba(0,0,0,0.85); }
    .hud-bl { position:absolute; left:42px; bottom:38px; font:700 24px/1 var(--sans); color:#fff; letter-spacing:1px;
      text-shadow:0 2px 6px rgba(0,0,0,0.85); }
    .hud-br { position:absolute; right:42px; bottom:38px; display:flex; align-items:flex-end; gap:5px; }
    .hud-br .bar { width:5px; background:var(--c-primary); border-radius:2px; opacity:.85; }
    .rec { position:absolute; right:42px; top:74px; display:flex; align-items:center; gap:8px;
      font:600 20px/1 var(--mono); color:#ff5b5b; text-shadow:0 2px 6px rgba(0,0,0,0.85); }
    .rec .dot { width:12px; height:12px; border-radius:50%; background:#ff5b5b; }
  </style>
</head>
<body>
  <!-- ★ 把 data-duration 换成原片实际时长（秒），data-fit-mode: cover=竖屏源铺满 / contain=横屏源转竖屏信箱 -->
  <div id="stage" data-composition-id="talking-head-motion-cut-v2" data-start="0" data-duration="46.84" data-fps="30" data-width="1080" data-height="1920" data-fit-mode="cover">

    <div class="video-wrapper" id="video-wrap">
      <video id="bg-video" src="input-video.mp4" playsinline data-has-audio="true" data-start="0" data-duration="46.84" data-track-index="1"></video>
    </div>
    <div class="dim-veil" id="dim-veil"></div>

    <!-- ════════ 视频标题卡（固定开头 0–4.5s，track-index=2）════════ -->
    <!-- ★ 封面式标题：纯文字 + 顶部渐变遮罩，无卡片容器/无错峰动效；文字须单独提炼（非口播第一句） -->
    <div class="card-host clip" data-card-id="title" data-start="0.0" data-duration="4.5" data-track-index="2"
      style="left:0;top:50px;width:1080px;height:340px;visibility:hidden;opacity:0;">
      <div class="card" data-card-id="title">
        <div class="root">
          <div class="ttl" id="t-title">视频标题</div>
          <div class="sub" id="t-sub">副标题</div>
        </div>
      </div>
    </div>

    <!-- ════════ 字幕 rail（逐句，track-index=10 最顶层）════════ -->
    <!-- 每组一句，emphasis 词用 .hl-key/.hl-num inline 标色；data-start/duration 对齐 transcript -->
    <!-- ↓↓↓ 按 transcript 段数继续复制 r1..rN，并在脚本 rails 数组同步添加 [id,start,duration] ↓↓↓ -->
    <div class="card-host clip" data-card-id="r1" data-start="0.0" data-duration="2.4" data-track-index="10"
      style="left:0;top:1540px;width:1080px;height:200px;visibility:hidden;opacity:0;">
      <div class="card" data-card-id="r1"><div class="rail-root"><div class="rail-pill">第一句字幕 <span class="hl-key">关键词</span></div></div></div>
    </div>
    <div class="card-host clip" data-card-id="r2" data-start="2.4" data-duration="2.3" data-track-index="10"
      style="left:0;top:1540px;width:1080px;height:200px;visibility:hidden;opacity:0;">
      <div class="card" data-card-id="r2"><div class="rail-root"><div class="rail-pill">第二句字幕</div></div></div>
    </div>
    <div class="card-host clip" data-card-id="r3" data-start="5.0" data-duration="0.5" data-track-index="10"
      style="left:0;top:1540px;width:1080px;height:200px;visibility:hidden;opacity:0;">
      <div class="card" data-card-id="r3"><div class="rail-root"><div class="rail-pill">过渡短句</div></div></div>
    </div>

    <!-- ════════ 步骤①动效面板：类型 A 具象UI（含进度计数）════════ -->
    <!-- data-start/duration 换成该段口播起止（示例 6.6–16.0）；内部元素逐句跟口播弹出 -->
    <!-- ★ LOCK 几何：下面 inline style 的 left:90px;top:540px;width:900px;height:740px 是 v4 验证过的锁定值，

    <!-- ════════ 取景器 HUD（常驻，track-index=9）════════ -->
    <!-- ★ LOCK 常驻装饰：四角 .bracket 属于本 HUD 层，data-start="0" 覆盖全片、全程可见。
         严禁把括号移进任何动效面板、严禁让括号随面板出现/消失；这是 v4 成片「四角固定装饰」的来源。 -->
    <div class="card-host" data-card-id="hud" data-start="0" data-duration="46.84" data-track-index="9"
      style="left:0;top:0;width:1080px;height:1920px;visibility:hidden;opacity:0;">
      <div class="card" data-card-id="hud">
        <div class="hud">
          <div class="bracket tl"></div><div class="bracket tr"></div><div class="bracket bl"></div><div class="bracket br"></div>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const stageEl = document.getElementById('stage');
        const D = parseFloat(stageEl.dataset.duration) || 46.84;   // 总时长（取 HTML data-duration）
        const tl = window.gsap.timeline({ paused: true });
        const Q = (id) => '.card[data-card-id="' + id + '"] ';      // 内部动画选择器 helper
        const H = (id) => '.card-host[data-card-id="' + id + '"]';

        /* ════════ 步骤时间码 config（示例值，⚠️必须按 transcript 替换为真实口播时间码）════════
           面板 start = 该段口播起点，面板 end = 该段口播终点（面板时长=口播时长，节奏才对齐）。
           背景留白段（步骤④）不在此列——它不挂面板，背景承接上一段 blurOff 保持清晰。 */
        const S1 = 6.6,  D1 = 9.4;    // 步骤① 具象UI
        const S2 = 17.0, D2 = 8.75;   // 步骤② 素材展示
        const S3 = 27.0, D3 = 8.5;    // 步骤③ 聊天气泡
        const SF = 42.7;              // 结尾总结卡起点

        /* ── 背景虚化控制（blurOn 虚化+压暗 / blurOff 恢复清晰）── */
        const bgV = document.getElementById('bg-video');
        const dimVeil = document.getElementById('dim-veil');
        const bgState = { b: 0, d: 0 };
        function applyBg() {
          if (bgV) bgV.style.filter = 'blur(' + bgState.b + 'px) brightness(' + (1 - bgState.b * 0.02) + ')';
          if (dimVeil) dimVeil.style.opacity = bgState.d;
        }
        applyBg();
        function blurOn(s)  { tl.to(bgState, { b: 16, d: 0.5, duration: 0.35, ease: 'power2.out', onUpdate: applyBg }, s); }
        function blurOff(s) { tl.to(bgState, { b: 0,  d: 0,   duration: 0.4,  ease: 'power2.in',  onUpdate: applyBg }, s); }
        function motOut(id, s, d) { tl.to(H(id), { opacity: 0, y: -16, duration: 0.25, ease: 'power2.in' }, s + d - 0.25);
          tl.set(H(id), { visibility: 'hidden' }, s + d); }

        /* ── 素材视频：逐帧 seek 到场景内相对时间并循环（类型 B 用）── */
        const mats = Array.from(document.querySelectorAll('video.material-clip'));
        mats.forEach(v => { v.muted = true; v.loop = true; try { v.load(); v.play().catch(()=>{}); } catch (e) {} });
        tl.eventCallback('onUpdate', () => {
          const t = tl.time();
          mats.forEach(v => {
            const start = parseFloat(v.dataset.sceneStart) || 0;
            const dur = v.duration || 0;
            if (dur > 0) { const rt = Math.max(0, t - start); try { v.currentTime = rt % dur; } catch (e) {} }
          });
        });

        /* ══ 关键：锚定 #video-wrap 触发全 DOM 渲染（背景虚化 + 内嵌视频必须） ══ */
        tl.to('#video-wrap', { scale: 1, duration: D, ease: 'none' }, 0);

        /* ── 标题卡（封面式，干净淡入淡出）── */
        tl.set(H('title'), { visibility: 'visible' }, 0);
        tl.fromTo(H('title'), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0);
        tl.to(H('title'), { opacity: 0, y: -20, duration: 0.35, ease: 'power2.in' }, 4.1);
        tl.set(H('title'), { visibility: 'hidden' }, 4.5);

        /* ── 字幕逐句（时间码对齐 transcript；每组一句）── */
        const rails = [
          ['r1', 0.0, 2.4], ['r2', 2.4, 2.3], ['r3', 5.0, 0.5]
          // ↓↓↓ 按 transcript 继续加每组 [id, start, duration] ↓↓↓
        ];
        rails.forEach(([id, s, d]) => {
          tl.set(H(id), { visibility: 'visible' }, s);
          tl.fromTo(H(id), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' }, s);
          tl.to(H(id), { opacity: 0, y: -8, duration: 0.2, ease: 'power2.in' }, s + d - 0.2);
          tl.set(H(id), { visibility: 'hidden' }, s + d);
        });

        /* ════════════════════════════════════════════════════════════════════
           ⚠️ 动效类型【绝不写死】——下面 m1 / m2 / m3 只是「示例动效类型」
           实际每段挂什么面板，必须由该段口播文案语义决定（见 SKILL.md 阶段 2
           动效选型四步法 + motion-patterns / motion-blueprints / motion-rules /
           motion-transitions 工具箱）：具象UI / 素材展示 / 聊天气泡 / 数据面板 /
           对比表 / 流程连线 / 引用卡……任选或自创，无固定清单、无固定顺序。

           复制本模板时，请按你的文案把 m1/m2/m3 换成合适的具象形式；
           **但务必保留每个面板下面的「A 主元素入场 + B 子元素级联 + C 辅助元素
           + D 持续微动」丰度骨架，以及 easing 多样化**（back.out / power3.out /
           sine.inOut / elastic 交替，禁止全片只用 power2.out）。这是对齐参考技能
           script-to-motion-video 动效质量的关键。禁止退化成单组 fade+translateY。
           ══════════════════════════════════════════════════════════════════ */
        /* 步骤① 示例类型：具象UI（含进度计数 0→100%）—— 换成你文案合适的类型即可 */
        /* 进度计数用 this.progress() 取进度，避免闭包 TDZ 导致计数失效 */
        blurOn(S1);
        tl.set(H('m1'), { visibility: 'visible' }, S1);
        /* 【A 主元素入场】面板主卡弹入 */
        tl.fromTo(H('m1'), { opacity:0, scale:0.92, y:24 }, { opacity:1, scale:1, y:0, duration:0.5, ease:'power3.out' }, S1);
        tl.fromTo(Q('m1')+'#m1-glow', { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.7, ease:'sine.out' }, S1+0.05);
        /* 【C 辅助元素】印章/角标砸下（elastic/back.out 冲击感） */
        tl.fromTo(Q('m1')+'#m1-badge', { opacity:0, scale:0.4, rotation:-20 }, { opacity:1, scale:1, rotation:-6, duration:0.45, ease:'back.out(2.4)' }, S1+0.18);
        tl.fromTo(Q('m1')+'#m1-kick', { opacity:0, y:12 }, { opacity:1, y:0, duration:0.35, ease:'power2.out' }, S1+0.32);
        tl.fromTo(Q('m1')+'#m1-title', { opacity:0, y:14 }, { opacity:1, y:0, duration:0.5, ease:'power4.out' }, S1+0.4);
        tl.to(Q('m1')+'#m1-uline', { scaleX:1, duration:0.5, ease:'power2.out' }, S1+0.52);
        /* 【B 子元素级联】卡内项逐条错位入场（时间点落在讲到对应信息处） */
        tl.fromTo(Q('m1')+'#m1-ava', { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.4, ease:'back.out(1.8)' }, S1+0.74);
        tl.fromTo(Q('m1')+'#m1-name', { opacity:0, x:-16 }, { opacity:1, x:0, duration:0.35 }, S1+0.84);
        tl.fromTo(Q('m1')+'#m1-i1', { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.4, ease:'power3.out' }, S1+1.1);
        tl.fromTo(Q('m1')+'#m1-i2', { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.4, ease:'power3.out' }, S1+2.4);
        tl.fromTo(Q('m1')+'#m1-i3', { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.4, ease:'power3.out' }, S1+3.4);
        /* 进度计数 0→100% */
        tl.fromTo(Q('m1')+'#m1-plab', { opacity:0 }, { opacity:1, duration:0.3 }, S1+0.7);
        tl.fromTo(Q('m1')+'#m1-fill', { scaleX:0 }, { scaleX:1, duration:2.2, ease:'power2.inOut',
          onUpdate: function() { var el = document.querySelector(Q('m1')+'#m1-plab'); if (el) el.textContent = '创建中 · ' + Math.round(this.progress()*100) + '%'; }
        }, S1+0.8);
        tl.fromTo(Q('m1')+'#m1-cap', { opacity:0, y:10 }, { opacity:1, y:0, duration:0.4 }, S1+1.7);
        /* 【D 持续微动】入场完成后启动（浮动 / 呼吸 / 光斑漂移，yoyo repeat:-1） */
        tl.to(Q('m1')+'#m1-glow', { scale:1.12, opacity:0.85, duration:2.2, yoyo:true, repeat:-1, ease:'sine.inOut' }, S1+1.0);
        motOut('m1', S1, D1); blurOff(S1 + D1 - 0.2);

        /* ════════ 步骤② 类型B 素材展示（模板素材区）════════ */
        blurOn(S2);
        tl.set(H('m2'), { visibility: 'visible' }, S2);
        /* 【A 主元素入场】 */
        tl.fromTo(H('m2'), { opacity:0, scale:1.06 }, { opacity:1, scale:1, duration:0.5, ease:'power3.out' }, S2);
        tl.fromTo(Q('m2')+'#m2-glow', { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.7, ease:'sine.out' }, S2+0.05);
        tl.fromTo(Q('m2')+'#m2-video', { opacity:0, scale:1.08 }, { opacity:1, scale:1, duration:0.6, ease:'power2.out' }, S2+0.12);
        /* 【B 子元素级联】四角信息卡 stagger 错位入场 */
        tl.fromTo([Q('m2')+'#m2-c1', Q('m2')+'#m2-c2', Q('m2')+'#m2-c3', Q('m2')+'#m2-c4'],
          { opacity:0, y:12 }, { opacity:1, y:0, duration:0.35, stagger:0.1, ease:'back.out(1.8)' }, S2+0.4);
        /* 【C 辅助元素】回复气泡弹入 */
        tl.fromTo(Q('m2')+'#m2-reply', { opacity:0, y:16, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:'back.out(1.7)' }, S2+4.5);
        /* 【D 持续微动】扫描线 + 录制点 + 角标浮动 */
        tl.fromTo(Q('m2')+'#m2-scan', { top:'2%', opacity:0 }, { top:'98%', opacity:1, duration:1.6, ease:'sine.inOut', repeat:-1, yoyo:true }, S2+0.7);
        tl.to(Q('m2')+'#m2-c2 .mat-rec', { opacity:0.3, scale:0.7, duration:0.7, yoyo:true, repeat:-1, ease:'sine.inOut' }, S2+0.7);
        tl.to([Q('m2')+'#m2-c1', Q('m2')+'#m2-c2', Q('m2')+'#m2-c3', Q('m2')+'#m2-c4'], { y:-5, duration:2.4, yoyo:true, repeat:-1, ease:'sine.inOut' }, S2+1.0);
        tl.to(Q('m2')+'#m2-glow', { scale:1.12, opacity:0.85, duration:2.2, yoyo:true, repeat:-1, ease:'sine.inOut' }, S2+1.0);
        motOut('m2', S2, D2); blurOff(S2 + D2 - 0.2);

        /* ════════ 步骤③ 类型C 聊天气泡 ════════ */
        blurOn(S3);
        tl.set(H('m3'), { visibility: 'visible' }, S3);
        /* 【A 主元素入场】 */
        tl.fromTo(H('m3'), { opacity:0, scale:0.92, y:24 }, { opacity:1, scale:1, y:0, duration:0.5, ease:'power3.out' }, S3);
        tl.fromTo(Q('m3')+'#m3-glow', { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.7, ease:'sine.out' }, S3+0.05);
        tl.fromTo(Q('m3')+'#m3-badge', { opacity:0, scale:0.4, rotation:-20 }, { opacity:1, scale:1, rotation:-6, duration:0.45, ease:'back.out(2.4)' }, S3+0.15);
        tl.fromTo(Q('m3')+'#m3-kick', { opacity:0, y:12 }, { opacity:1, y:0, duration:0.35, ease:'power2.out' }, S3+0.28);
        tl.fromTo(Q('m3')+'#m3-u', { opacity:0, y:16, scale:0.85 }, { opacity:1, y:0, scale:1, duration:0.4, ease:'back.out(1.7)' }, S3+0.4);
        tl.fromTo(Q('m3')+'#m3-a', { opacity:0, y:16 }, { opacity:1, y:0, duration:0.4, ease:'power2.out' }, S3+0.95);
        tl.fromTo(Q('m3')+'#m3-at', { clipPath:'inset(0 100% 0 0)' }, { clipPath:'inset(0 0% 0 0)', duration:2.6, ease:'none' }, S3+1.05);
        tl.fromTo(Q('m3')+'#m3-cap', { opacity:0, y:10 }, { opacity:1, y:0, duration:0.4 }, S3+3.0);
        /* 【D 持续微动】光晕呼吸 + 气泡轻浮 */
        tl.to(Q('m3')+'#m3-glow', { scale:1.14, opacity:0.85, duration:2.0, yoyo:true, repeat:-1, ease:'sine.inOut' }, S3+0.8);
        tl.to([Q('m3')+'#m3-u', Q('m3')+'#m3-a'], { y:-6, duration:2.6, yoyo:true, repeat:-1, ease:'sine.inOut' }, S3+0.9);
        motOut('m3', S3, D3); blurOff(S3 + D3 - 0.2);

        /* ════════ 步骤④ 背景留白（无面板）════════
           此处不调用 blurOn/不挂 .card-host，背景承接步骤③ blurOff(S3+D3-0.2) 保持清晰，
           直到 SF 总结卡覆盖。HUD 段标签仍显示「04」，期间纯真人讲述 + 字幕。 */

        /* ── 全屏总结卡 ── */
        tl.set(H('finale'), { visibility: 'visible' }, SF);
        tl.fromTo(H('finale'), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, SF);
        tl.fromTo(Q('finale')+'#f-h', { opacity:0, y:24 }, { opacity:1, y:0, duration:0.5, ease:'power2.out' }, SF+0.15);
        tl.fromTo(Q('finale')+'#f-cta', { opacity:0, scale:0.85 }, { opacity:1, scale:1, duration:0.45, ease:'back.out(1.6)' }, SF+0.8);
        tl.fromTo(Q('finale')+'#f-tag', { opacity:0, y:16 }, { opacity:1, y:0, duration:0.4, ease:'power2.out' }, SF+1.4);

        /* ── HUD 常驻 + 时间码/段标签 ── */
        tl.set(H('hud'), { visibility: 'visible' }, 0);
        tl.fromTo(H('hud'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
        const tcEl = document.getElementById('hud-tc');
        const segEl = document.getElementById('hud-seg');
        const segs = [
          [0, '01 · 开场'], [S1, '01 · 步骤一'], [S2, '02 · 步骤二(素材)'],
          [S3, '03 · 步骤三'], [S3 + D3, '04 · 步骤四'], [SF, '05 · 行动']
        ];
        const hudState = { t: 0 };
        tl.to(hudState, { t: D, duration: D, ease: 'none', onUpdate: () => {
          const t = hudState.t;
          const ss = Math.floor(t) % 60, ff = Math.floor((t % 1) * 30);
          if (tcEl) tcEl.textContent = '00:00:' + String(ss).padStart(2,'0') + ':' + String(ff).padStart(2,'0');
          let lb = segs[0][1];
          for (const g of segs) { if (t >= g[0]) lb = g[1]; }
          if (segEl) segEl.textContent = lb;
        } }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["talking-head-motion-cut-v2"] = tl;
      })();
    </script>
  </div>
</body>
</html>
