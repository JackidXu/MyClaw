name: Test Self-Hosted Runner Demo

on:
  # push:
  #   paths:
  #     - '.github/workflows/test-runner-demo.yml'
  workflow_dispatch:
    inputs:
      test_macos:
        description: 'Test macOS Runner'
        required: true
        default: true
        type: boolean
      test_windows:
        description: 'Test Windows Runner'
        required: true
        default: true
        type: boolean

jobs:
  # ========== macOS 自建节点轻量验证 ==========
  test-macos:
    if: ${{ github.event_name == 'push' || inputs.test_macos }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: 打印主机环境信息
        run: |
          echo "=== 节点操作系统与架构信息 ==="
          uname -a
          sw_vers
          echo "当前架构: $(uname -m)"
          echo "当前用户: $(whoami)"
          echo "工作目录: $(pwd)"
          echo "Node 版本: $(node -v || echo '未预装 Node')"
          echo "pnpm 版本: $(pnpm -v || echo '未预装 pnpm')"

      - name: 钥匙串与签名环境最小验证 (不编译任何真实代码)
        run: |
          echo "=== 检查系统 Keychain 环境 ==="
          security list-keychains
          echo "=== 临时目录权限与创建测试 ==="
          TEST_DIR="${RUNNER_TEMP:-/tmp}/heyclaw-runner-test"
          mkdir -p "$TEST_DIR"
          echo "Keychain sandbox path: $TEST_DIR"
          rm -rf "$TEST_DIR"
          echo "✓ macOS 最小环境验证通过"

  # ========== Windows 自建节点轻量验证 ==========
  test-windows:
    if: ${{ github.event_name == 'push' || inputs.test_windows }}
    runs-on: [self-hosted, Windows]
    steps:
      - name: 打印主机环境信息
        shell: powershell
        run: |
          Write-Host "=== Windows 节点信息 ==="
          [System.Environment]::OSVersion.VersionString
          Write-Host "计算机名: $env:COMPUTERNAME"
          Write-Host "当前用户: $env:USERNAME"
          Write-Host "工作目录: $(Get-Location)"
          try { node -v } catch { Write-Host "未检测到 Node.js" }
          try { pnpm -v } catch { Write-Host "未检测到 pnpm" }
          try { git --version } catch { Write-Host "未检测到 Git" }
          Write-Host "✓ Windows 最小环境验证通过"
