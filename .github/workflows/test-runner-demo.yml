name: Test Self-Hosted Runner Demo

on:
  push:
    paths:
      - '.github/workflows/test-runner-demo.yml'
  workflow_dispatch:
    inputs:
      test_macos:
        description: 'Test macOS Runner'
        required: true
        default: true
        type: boolean
      test_windows:
        description: 'Test Windows Runner'
        required: true
        default: true
        type: boolean

jobs:
  # ========== macOS 自建节点轻量验证 ==========
  test-macos:
    if: ${{ github.event_name == 'push' || inputs.test_macos }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: 打印主机环境信息
        run: |
          echo "=== 节点操作系统与架构信息 ==="
          uname -a
          sw_vers
          echo "当前架构: $(uname -m)"
          echo "当前用户: $(whoami)"
          echo "工作目录: $(pwd)"
          echo "Node 版本: $(node -v || echo '未预装 Node')"
          echo "pnpm 版本: $(pnpm -v || echo '未预装 pnpm')"

      - name: 钥匙串与签名环境最小验证 (不编译任何真实代码)
        run: |
          echo "=== 检查系统 Keychain 环境 ==="
          security list-keychains
          echo "=== 临时目录权限与创建测试 ==="
          TEST_DIR="${RUNNER_TEMP:-/tmp}/heyclaw-runner-test"
          mkdir -p "$TEST_DIR"
          echo "Keychain sandbox path: $TEST_DIR"
          rm -rf "$TEST_DIR"
          echo "✓ macOS 最小环境验证通过"

      - name: 生成轻量模拟产物
        run: |
          mkdir -p test-dist
          echo "HeyClaw macOS Self-Hosted Runner Build Demo - $(date)" > test-dist/demo-macos-output.txt
          echo "Arch: $(uname -m)" >> test-dist/demo-macos-output.txt

      - name: 上传测试产物
        uses: actions/upload-artifact@v4
        with:
          name: demo-macos-artifact
          path: test-dist/demo-macos-output.txt
          retention-days: 1

  # ========== Windows 自建节点轻量验证 ==========
  test-windows:
    if: ${{ github.event_name == 'push' || inputs.test_windows }}
    runs-on: [self-hosted, Windows]
    steps:
      - name: 打印主机环境信息
        shell: pwsh
        run: |
          Write-Host "=== Windows 节点信息 ==="
          [System.Environment]::OSVersion.VersionString
          Write-Host "计算机名: $env:COMPUTERNAME"
          Write-Host "当前用户: $env:USERNAME"
          Write-Host "工作目录: $(Get-Location)"
          try { node -v } catch { Write-Host "未检测到 Node.js" }
          try { pnpm -v } catch { Write-Host "未检测到 pnpm" }
          try { git --version } catch { Write-Host "未检测到 Git" }

      - name: 生成轻量模拟产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-dist
          $content = "HeyClaw Windows Self-Hosted Runner Build Demo - $(Get-Date)"
          Set-Content -Path test-dist\demo-windows-output.txt -Value $content
          Write-Host "✓ Windows 最小环境验证通过"

      - name: 上传测试产物
        uses: actions/upload-artifact@v4
        with:
          name: demo-windows-artifact
          path: test-dist/demo-windows-output.txt
          retention-days: 1

