name: Test macOS Notarize Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-mac-notarize.yml'

jobs:
  test-notarize:
    runs-on: macos-latest
    steps:
      - name: Setup macOS Keychain
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 使用固定密码创建临时专用钥匙串（避免 login.keychain 无人值守解锁死锁问题）
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS="heyclaw-ci-$(date +%s)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 将证书导入临时钥匙串
          echo "$CSC_LINK_B64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -A -T /usr/bin/codesign
          rm -f /tmp/certificate.p12

          # 将临时钥匙串加入搜索列表的最前面
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          # 放行私钥分区（临时钥匙串密码已知，不会触发弹窗）
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "=== 已加载的签名证书 ==="
          security find-identity -v -p codesigning

      - name: Create & Sign Minimal Probe App
        run: |
          mkdir -p ProbeApp.app/Contents/MacOS
          cat << 'EOF' > ProbeApp.app/Contents/MacOS/ProbeApp
          #!/bin/bash
          echo "HeyClaw Probe"
          EOF
          chmod +x ProbeApp.app/Contents/MacOS/ProbeApp
          cat << 'EOF' > ProbeApp.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.heyclaw.probe</string>
            <key>CFBundleName</key>
            <string>ProbeApp</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleExecutable</key>
            <string>ProbeApp</string>
          </dict>
          </plist>
          EOF
          
          # 正式签名并开启 hardened runtime（使用前序步骤创建的临时专用钥匙串）
          codesign --force --deep --sign "Developer ID Application: Huizhou Bancheng Media Co., Ltd. (VNH5J9U65J)" --options runtime --keychain "$KEYCHAIN_PATH" ProbeApp.app
          codesign -vvv --deep --strict ProbeApp.app
          ditto -c -k --keepParent ProbeApp.app ProbeApp.zip

      - name: Submit to Apple Notarization Service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit ProbeApp.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
