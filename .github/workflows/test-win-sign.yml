name: Test Windows OSS Code Sign Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-win-sign.yml'

jobs:
  test-win-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install ali-oss
        run: npm install ali-oss

      # 下载你指定的真实安装包进行实战大文件（200MB+）测试
      - name: Download Real HeyClaw Windows Installer
        run: |
          echo "Downloading real Windows installer from CDN..."
          curl -fSL "https://scrm0.cdn.banchengyun.com/heyclaw-dev/downloads/HeyClaw-win-x64-1.3.4-alpha-official.exe" -o test-installer.exe
          ls -lh test-installer.exe

      # 真实测试全链路：OSS 分片并发上传 -> 签名机 /sign-oss 签名 -> 下载已签名包并校验大小与签名
      - name: Run Windows OSS Sign Test
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          WIN_SIGN_SERVICE_URL: ${{ secrets.WIN_SIGN_SERVICE_URL }}
          WIN_SIGN_SERVICE_SECRET: ${{ secrets.WIN_SIGN_SERVICE_SECRET }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const OSS = require('ali-oss');

          async function runTest() {
            const ossClient = new OSS({
              endpoint: process.env.OSS_ENDPOINT,
              accessKeyId: process.env.OSS_ACCESS_KEY_ID,
              accessKeySecret: process.env.OSS_ACCESS_KEY_SECRET,
              bucket: process.env.OSS_BUCKET,
            });

            const filePath = path.resolve('test-installer.exe');
            const originalSize = fs.statSync(filePath).size;
            const ossKey = `heyclaw-dev/win-sign/test_${Date.now()}_installer.exe`;

            console.log(`[1/4] Uploading real package to OSS: ${ossKey} (${(originalSize / 1024 / 1024).toFixed(1)} MB)...`);
            const t0 = Date.now();
            await ossClient.multipartUpload(ossKey, filePath, {
              parallel: 4,
              partSize: 10 * 1024 * 1024
            });
            console.log(`✓ Upload complete in ${((Date.now() - t0) / 1000).toFixed(1)}s`);

            console.log(`[2/4] Calling Windows Signing Service /sign-oss...`);
            const t1 = Date.now();
            const serviceUrl = process.env.WIN_SIGN_SERVICE_URL.replace(/\/+$/, '');
            const resp = await fetch(`${serviceUrl}/sign-oss`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-sign-secret': process.env.WIN_SIGN_SERVICE_SECRET,
              },
              body: JSON.stringify({ ossKey }),
            });

            if (!resp.ok) {
              const errText = await resp.text();
              throw new Error(`Sign request failed: HTTP ${resp.status} - ${errText}`);
            }

            const data = await resp.json();
            console.log(`✓ Service response:`, data);
            console.log(`✓ Server sign complete in ${((Date.now() - t1) / 1000).toFixed(1)}s`);

            const signedOssKey = data.signedOssKey;
            if (!signedOssKey) {
              throw new Error(`Missing signedOssKey in response: ${JSON.stringify(data)}`);
            }

            console.log(`[3/4] Downloading signed package from OSS: ${signedOssKey}...`);
            const t2 = Date.now();
            const signedLocalPath = path.resolve('signed-test-installer.exe');
            await ossClient.get(signedOssKey, signedLocalPath);
            console.log(`✓ Download complete in ${((Date.now() - t2) / 1000).toFixed(1)}s`);

            const signedSize = fs.statSync(signedLocalPath).size;
            console.log(`Signed file size: ${signedSize} bytes (original: ${originalSize} bytes)`);

            if (signedSize < originalSize) {
              throw new Error(`Signed file is smaller than original (${signedSize} < ${originalSize})`);
            }

            console.log(`🎉 All Windows OSS Sign Probe checks PASSED successfully!`);
          }



          runTest().catch(err => {
            console.error('Probe failed:', err);
            process.exit(1);
          });
          EOF
