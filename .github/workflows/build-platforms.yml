name: Build Platforms

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  # ========== macOS 构建 (同事 M 系列 Mac 自建 Runner，原生打出双架构) ==========
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64] # 同事 M 芯片凭借 Rosetta 2 原生双架构极速构建
    steps:
      - uses: actions/checkout@v4

      - name: Clean Workspace (防脏构建，保留依赖与 OpenClaw 运行时缓存)
        run: |
          echo "[Clean] Cleaning up untracked artifacts while preserving node_modules and openclaw runtime..."
          git clean -ffdx -e node_modules -e "node_modules/**" -e vendor/openclaw-runtime -e "vendor/openclaw-runtime/**" -e vendor/openclaw-plugins -e "vendor/openclaw-plugins/**" || true
          rm -rf release dist-files oss-dist || true

      - name: Ensure pnpm
        run: which pnpm || npm install -g pnpm@10

      # 若是 tag 触发，则在安装依赖前动态修改 package.json 的版本，确保打包后的版本与 tag 统一
      - name: Sync version to package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm ci || npm install

      # 设置 OpenClaw runtime (由 dist 脚本内部完整构建，此处仅做存在性检查与提示)
      - name: Setup OpenClaw Runtime
        run: |
          if [ -d "vendor/openclaw-runtime/current" ]; then
            echo "✓ OpenClaw runtime found"
          else
            echo "⚠ OpenClaw runtime not found, build will initialize it automatically"
          fi

      # 临时专用钥匙串：自动解锁并设置搜索列表，无弹窗自动化签名
      - name: Setup macOS Keychain
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS="heyclaw-ci-$(date +%s)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          # 先尝试删除可能残留的同路径钥匙串
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 导入证书到临时钥匙串
          echo "$CSC_LINK_B64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f /tmp/certificate.p12

          # 将临时钥匙串加入搜索列表最前面
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          # 放行私钥分区
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 验证证书加载
          security find-identity -v -p codesigning

      - name: Build macOS
        run: npm run dist:mac:${{ matrix.arch }} -- --publish never
        env:
          CSC_NAME: "Huizhou Bancheng Media Co., Ltd. (VNH5J9U65J)"
          CSC_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Determine OSS Path
        run: |
          OSS_PATH="heyclaw-dev/downloads"
          BRANCHES=$(git branch -r --contains HEAD || true)
          if echo "$BRANCHES" | grep -qE "origin/main$|origin/main "; then
            OSS_PATH="heyclaw/downloads"
          fi
          echo "OSS_PATH=$OSS_PATH" >> $GITHUB_ENV

      # 自建机直传阿里云 OSS（国内高速上传，不走 GitHub 暂存）
      - name: Upload DMG to Aliyun OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          echo "[Upload] Uploading macOS DMG directly to OSS..."
          if ! command -v ossutil &> /dev/null; then
            if [ ! -f "/tmp/ossutil" ]; then
              curl -fSL "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutilmac64" -o /tmp/ossutil
              chmod +x /tmp/ossutil
            fi
            OSSUTIL_BIN="/tmp/ossutil"
          else
            OSSUTIL_BIN="ossutil"
          fi
          $OSSUTIL_BIN cp -f release/*.dmg oss://${OSS_BUCKET}/${OSS_PATH}/ -e ${OSS_ENDPOINT} -i ${OSS_ACCESS_KEY_ID} -k ${OSS_ACCESS_KEY_SECRET}

      - name: Cleanup macOS Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "[Cleanup] Deleting temporary build keychain..."
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ========== Windows 构建 (恢复官方白板机：128G 高速磁盘，彻底根除 2GB 爆盘与国内丢包) ==========
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pnpm\Cache
            vendor/openclaw-runtime
            vendor/openclaw-plugins
          key: openclaw-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            openclaw-deps-${{ runner.os }}-

      - name: Sync version to package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          npm version $VERSION --no-git-version-keyword --no-git-tag-version --allow-same-version || npm version $VERSION --no-git-tag-version --allow-same-version

      - run: npm install

      - name: Setup Python Runtime
        run: npm run setup:python-runtime
        env:
          LOBSTERAI_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}

      - name: Determine Windows Sign OSS Prefix
        shell: bash
        run: |
          WIN_SIGN_OSS_PREFIX="heyclaw-dev/win-sign"
          BRANCHES=$(git branch -r --contains HEAD || true)
          if echo "$BRANCHES" | grep -qE "origin/main$|origin/main "; then
            WIN_SIGN_OSS_PREFIX="heyclaw/win-sign"
          fi
          echo "WIN_SIGN_OSS_PREFIX=$WIN_SIGN_OSS_PREFIX" >> $GITHUB_ENV

      - name: Setup ossutil on Windows
        shell: bash
        run: |
          echo "[Setup] Downloading official ossutil for Windows..."
          curl -fSL --retry 3 "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64.zip" -o ossutil64.zip || true
          if [ -f ossutil64.zip ]; then
            unzip -q -o ossutil64.zip || true
            OSSUTIL_DIR=$(find . -maxdepth 1 -type d -name "ossutil64*" | head -n 1)
            if [ -n "$OSSUTIL_DIR" ] && [ -d "$OSSUTIL_DIR" ]; then
              FULL_PATH="$(pwd)/$OSSUTIL_DIR"
              echo "$FULL_PATH" >> $GITHUB_PATH
              echo "OSSUTIL_PATH=$FULL_PATH/ossutil64.exe" >> $GITHUB_ENV
              echo "[Setup] Installed ossutil to PATH: $FULL_PATH"
              "$FULL_PATH/ossutil64.exe" --version || true
            fi
          fi

      - name: Build Windows
        shell: bash
        run: |
          if [[ ! -f "$WIN_CSC_LINK" && ${#WIN_CSC_LINK} -lt 100 ]]; then
            echo "[Codesign] 检测到 WIN_CSC_LINK 为无效占位符 (${WIN_CSC_LINK})，彻底注销签名环境变量以跳过签名。"
            unset WIN_CSC_LINK
            unset CSC_LINK
            unset WIN_CSC_KEY_PASSWORD
            unset CSC_KEY_PASSWORD
          fi
          npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_SIGN_CERT_SHA1: ${{ secrets.WIN_SIGN_CERT_SHA1 }}
          WIN_SIGN_SERVICE_URL: ${{ secrets.WIN_SIGN_SERVICE_URL }}
          WIN_SIGN_SERVICE_SECRET: ${{ secrets.WIN_SIGN_SERVICE_SECRET }}
          WIN_SIGN_OSS_PREFIX: ${{ env.WIN_SIGN_OSS_PREFIX }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000

      - name: Determine OSS Path
        shell: bash
        run: |
          OSS_PATH="heyclaw-dev/downloads"
          BRANCHES=$(git branch -r --contains HEAD || true)
          if echo "$BRANCHES" | grep -qE "origin/main$|origin/main "; then
            OSS_PATH="heyclaw/downloads"
          fi
          echo "OSS_PATH=$OSS_PATH" >> $GITHUB_ENV

      # 官方机直传阿里云 OSS（不走 GitHub 中转，链路极短）
      - name: Upload EXE to Aliyun OSS
        shell: bash
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          echo "[Upload] Uploading Windows EXE directly to OSS..."
          CLEAN_ENDPOINT=$(echo "${OSS_ENDPOINT}" | sed -E 's|^https?://||')
          ossutil64 cp -f -r release/ "oss://${OSS_BUCKET}/${OSS_PATH}/" --include "*.exe" -e "${CLEAN_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}"

  # ========== 更新应用内检测更新元数据 (version.json) ==========
  update-version-manifest:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine OSS Path
        run: |
          OSS_PATH="heyclaw-dev/downloads"
          BRANCHES=$(git branch -r --contains HEAD || true)
          if echo "$BRANCHES" | grep -qE "origin/main$|origin/main "; then
            OSS_PATH="heyclaw/downloads"
          fi
          echo "OSS_PATH=$OSS_PATH" >> $GITHUB_ENV

      - name: Setup OSSUTIL
        uses: manyuanrong/setup-ossutil@master
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Generate and Upload version.json
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p meta-dist

          echo "[Manifest] Fetching latest uploaded filenames from OSS..."
          ossutil ls oss://${{ secrets.OSS_BUCKET }}/${{ env.OSS_PATH }}/ > /tmp/oss_list.txt || true

          # 严密解析对应的文件名 (带空值容错)
          WIN_FILE=$(grep -E "${TAG_NAME}.*\.exe" /tmp/oss_list.txt | awk '{print $NF}' | xargs -n 1 basename | head -n 1 || true)
          MAC_ARM64_FILE=$(grep -E "${TAG_NAME}.*arm64.*\.dmg" /tmp/oss_list.txt | awk '{print $NF}' | xargs -n 1 basename | head -n 1 || true)
          MAC_X64_FILE=$(grep -E "${TAG_NAME}.*(x64|mac).*\.dmg" /tmp/oss_list.txt | grep -v "arm64" | awk '{print $NF}' | xargs -n 1 basename | head -n 1 || true)

          CDN_PREFIX="${{ secrets.CDN_URL_PREFIX }}"
          if [ -n "$CDN_PREFIX" ]; then
            CDN_PREFIX="${CDN_PREFIX%/}"
            [ -n "$WIN_FILE" ] && WIN_URL="${CDN_PREFIX}/${{ env.OSS_PATH }}/${WIN_FILE}" || WIN_URL=""
            [ -n "$MAC_ARM64_FILE" ] && MAC_ARM64_URL="${CDN_PREFIX}/${{ env.OSS_PATH }}/${MAC_ARM64_FILE}" || MAC_ARM64_URL=""
            [ -n "$MAC_X64_FILE" ] && MAC_X64_URL="${CDN_PREFIX}/${{ env.OSS_PATH }}/${MAC_X64_FILE}" || MAC_X64_URL=""
          else
            WIN_URL="${WIN_FILE}"
            MAC_ARM64_URL="${MAC_ARM64_FILE}"
            MAC_X64_URL="${MAC_X64_FILE}"
          fi

          cat <<EOF > meta-dist/version.json
          {
            "version": "${TAG_NAME}",
            "date": "$(date +'%Y-%m-%d')",
            "files": {
              "windows": "${WIN_URL}",
              "mac_x64": "${MAC_X64_URL}",
              "mac_arm64": "${MAC_ARM64_URL}"
            }
          }
          EOF

          echo "=== Generated version.json ==="
          cat meta-dist/version.json

          ossutil cp -f meta-dist/version.json oss://${{ secrets.OSS_BUCKET }}/${{ env.OSS_PATH }}/version.json
