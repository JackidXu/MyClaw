name: Test macOS Code Sign & Notarize

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-mac-sign-notarize.yml'

jobs:
  test-electron-builder-sign-notarize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 1. 自建临时专用钥匙串并导入证书（解决 electron-builder 内部 set-key-partition-list Bug 及 login.keychain 死锁）
      - name: Setup Dedicated macOS Keychain
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS="heyclaw-ci-$(date +%s)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 导入证书
          echo "$CSC_LINK_B64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f /tmp/certificate.p12

          # 设置钥匙串搜索路径，确保 codesign 和 electron-builder 优先检索
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          # 放行私钥分区
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "=== 证书身份识别 ==="
          security find-identity -v -p codesigning

      # 2. 构建极简 Electron 空壳，完全不带业务代码与庞大依赖，实现秒级准备
      - name: Setup Minimal Electron Probe App
        run: |
          mkdir -p probe-app
          cd probe-app
          cat << 'EOF' > package.json
          {
            "name": "heyclaw-probe",
            "version": "1.0.0",
            "main": "main.js",
            "build": {
              "appId": "com.bcy.claw",
              "mac": {
                "category": "public.app-category.productivity",
                "hardenedRuntime": true,
                "gatekeeperAssess": false,
                "notarize": true
              }
            }
          }
          EOF
          cat << 'EOF' > main.js
          const { app } = require('electron');
          app.whenReady().then(() => app.quit());
          EOF
          npm install electron electron-builder --save-dev

      # 3. 真实测试 electron-builder 消费自建钥匙串进行签名与公证
      - name: Run electron-builder Sign & Notarize
        working-directory: probe-app
        env:
          CSC_NAME: "Developer ID Application: Huizhou Bancheng Media Co., Ltd. (VNH5J9U65J)"
          CSC_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac --arm64 --publish never


